name: ios-build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      server_ip:
        description: "IP сервера, на который редиректим connect()"
        required: false
        default: "2.26.123.219"
      dobby_ref:
        description: "Dobby ref (branch / tag / commit)"
        required: false
        default: "master"
      ios_min:
        description: "Минимальная версия iOS"
        required: false
        default: "12.0"
      tls_hook:
        description: "1 = хукать TLS через Dobby, 0 = только подмена connect"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS arm64 (device)
    # macos-14 (arm64) выведен из GitHub Actions 02.11.2026 -> "configuration ... is not supported".
    # Актуальные arm64-лейблы: macos-15, macos-26, macos-latest.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SERVER_IP: ${{ github.event.inputs.server_ip || '2.26.123.219' }}
      DOBBY_REF: ${{ github.event.inputs.dobby_ref || 'master' }}
      IOS_MIN: ${{ github.event.inputs.ios_min || '12.0' }}
      TLS_HOOK: ${{ github.event.inputs.tls_hook || '1' }}

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          echo "runner: ${ImageOS:-?} ${ImageVersion:-?} $(uname -m)"
          xcodebuild -version
          echo "SDK: $(xcrun --sdk iphoneos --show-sdk-path) ($(xcrun --sdk iphoneos --show-sdk-version))"
          echo "server_ip=$SERVER_IP dobby_ref=$DOBBY_REF ios_min=$IOS_MIN tls_hook=$TLS_HOOK"

      - name: Build Dobby (static, iOS arm64)
        run: bash scripts/build_dobby_ios.sh

      - name: Build standcore.dylib
        run: bash scripts/build_standcore_ios.sh

      - name: Verify
        run: |
          set -euo pipefail
          BIN=build/ios/standcore.dylib
          lipo -info "$BIN"
          otool -L "$BIN"
          otool -l "$BIN" | grep -A2 LC_BUILD_VERSION || true
          if [ "$TLS_HOOK" != "0" ]; then
            nm -g "$BIN" | grep -q ' T _DobbyHook' && echo "OK: Dobby слинкован"
            if nm -u "$BIN" | grep -qi dobby; then
              echo "!! неразрешённые символы Dobby — процесс упадёт на первом вызове:"
              nm -u "$BIN" | grep -i dobby
              exit 1
            fi
          fi
          # подмена connect живёт в __DATA,__interpose (dyld), кода не патчим
          INTERPOSE="$(otool -s __DATA __interpose "$BIN" 2>/dev/null | grep -E '^[0-9a-f]{8}' | head -2)"
          if [ -z "$INTERPOSE" ]; then
            echo "!! нет секции __DATA,__interpose — подмена connect не сработает"
            exit 1
          fi
          echo "$INTERPOSE"
          codesign -dv "$BIN" 2>&1 | head -5 || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standcore-ios-${{ github.sha }}
          path: |
            build/ios/standcore.dylib
            build/ios/libdobby.a
            build/ios/include/dobby.h
          if-no-files-found: error
          retention-days: 30
